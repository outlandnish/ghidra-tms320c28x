name: build

# Compiles the SLEIGH module on every push/PR.
#
# Why this exists: the .sla is a BUILD ARTIFACT generated from the .sinc/.slaspec
# sources, and nothing previously proved the two agreed. A stale .sla is the worst
# kind of failure here -- the sources say one thing, the loaded module does another,
# and there is no error to notice it by. You just get silently wrong disassembly.
#
# This workflow (a) proves the sources still compile, (b) publishes the compiled
# .sla and the installable extension zip as downloadable artifacts so users do not
# need the SLEIGH compiler, and (c) guards against a committed .sla drifting out of
# sync with the sources.
#
# RELEASING IS MANUAL. Run this workflow from the Actions tab with "Cut a release"
# ticked. Cutting a release is a decision, not a side effect of merging -- a release
# per merge would bury the meaningful ones in noise. The build itself still runs on
# every push and PR, so the release path is only ever asked to publish artifacts
# that CI has already built and checked.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Cut a CalVer release (vYYYY.MM.DD) from this build"
        type: boolean
        default: false

env:
  # Pin the Ghidra version the module is developed against. The exact release asset
  # (which carries a date stamp, e.g. ghidra_12.1.2_PUBLIC_20260605.zip) is resolved
  # from the releases API so the date does not have to be hardcoded here.
  GHIDRA_VERSION: "12.1.2"

jobs:
  sleigh:
    name: Compile SLEIGH module
    runs-on: ubuntu-latest
    permissions:
      contents: read       # build never needs write; only the release job does
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # needed to diff a PR against its base

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Static text check over data/languages -- no Ghidra, no SLEIGH compile -- so it runs
      # before the download and fails in seconds. Guards the RPT/RPTB phase-bit partition:
      # a `:MNEMONIC` added without `& rpt_phase=1` decodes correctly and passes every other
      # test here, and the ONLY symptom is that `RPT || <it>` executes once instead of N+1
      # times. Nothing downstream can see that, which is why it gets its own gate.
      - name: Invariant — every constructor carries the RPT phase bit
        run: bash tests/run_phase_check.sh

      - name: Resolve Ghidra release asset
        id: ghidra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases?per_page=100" \
                | jq -r --arg v "$GHIDRA_VERSION" '
                    .[].assets[]
                    | select(.name | test("^ghidra_" + $v + "_PUBLIC_[0-9]{8}\\.zip$"))
                    | .browser_download_url' \
                | head -1)
          if [ -z "$url" ]; then
            echo "::error::No Ghidra $GHIDRA_VERSION release asset found. Bump GHIDRA_VERSION in this workflow."
            exit 1
          fi
          echo "url=$url"                        >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$url" .zip)"    >> "$GITHUB_OUTPUT"
          echo "Resolved: $url"

      - name: Cache Ghidra
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/ghidra
          key: ghidra-${{ steps.ghidra.outputs.name }}

      - name: Download Ghidra
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/ghidra
          curl -sSL "${{ steps.ghidra.outputs.url }}" -o /tmp/ghidra.zip
          unzip -q /tmp/ghidra.zip -d ~/ghidra

      - name: Compile the language
        run: |
          set -euo pipefail
          GHIDRA_DIR=$(find ~/ghidra -maxdepth 1 -type d -name 'ghidra_*' | head -1)
          if [ -z "$GHIDRA_DIR" ]; then echo "::error::Ghidra install not found"; exit 1; fi
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"

          # Mirror data/buildLanguage.xml: options from sleighArgs.txt, compile every
          # .slaspec in data/languages.
          cd data
          "$GHIDRA_DIR/support/sleigh" -i sleighArgs.txt -a ./languages 2>&1 | tee /tmp/sleigh.log

          # The sleigh launcher does not always propagate a non-zero exit, and a failed
          # compile simply writes no .sla -- so assert both conditions explicitly.
          if grep -q "^ERROR" /tmp/sleigh.log; then
            echo "::error::SLEIGH reported errors:"
            grep "^ERROR" /tmp/sleigh.log | head -20
            exit 1
          fi
          if [ ! -f languages/tms320c28x.sla ]; then
            echo "::error::No .sla produced."
            exit 1
          fi
          echo "Built $(stat -c%s languages/tms320c28x.sla) bytes"
          echo "Warnings: $(grep -c '^WARN' /tmp/sleigh.log || true)"

      # The `sleigh` compile above never reads the .cspec/.pspec -- those are parsed only
      # when Ghidra binds a program to the language at RUNTIME. So a cspec that names a
      # register the language doesn't define (or any other runtime-only breakage) compiles
      # green, zips green, and is nonetheless completely unloadable -- exactly the failure
      # mode that shipped an "Unknown register: PM" cspec undetected. This step closes that
      # gap: run_disasm_test.sh reinstalls the freshly built module and does a headless
      # import, which binds the language (parsing cspec + pspec) and disassembles a 14-case
      # fixture, diffing against the expected decode. It exits non-zero on any load OR
      # decode failure. This is the only CI step that proves the module actually LOADS.
      - name: Smoke test — language loads and disassembles (runtime cspec/pspec bind)
        run: bash tests/run_disasm_test.sh

      # The conditioning intrinsics (TMU_COND_OPERAND / FPU_MINMAX_FLUSH) are pcodeops,
      # so their behaviour lives in the compiled state modifier rather than the .sla. The
      # semantics test below needs it installed -- and the pspec names the class, so
      # without the jar the emulator will not start at all.
      - name: Build the emulation state modifier
        run: bash tests/build_modifier.sh

      # The disassembly test above proves the listing; this proves the p-code. It
      # emulates the FPU flag instructions and the conditioning intrinsics and reads the
      # registers back, which is the only way to catch a wrong bit order inside a split
      # mask, or an unregistered intrinsic -- both still disassemble to something
      # entirely plausible.
      - name: Semantics test — emulate the FPU flag and conditioning instructions
        run: bash tests/run_emu_test.sh

      - name: Guard against a stale committed .sla
        run: |
          set -euo pipefail
          SLA=data/languages/tms320c28x.sla

          if ! git ls-files --error-unmatch "$SLA" >/dev/null 2>&1; then
            echo "$SLA is not tracked (build artifact only) -- nothing to keep in sync."
            exit 0
          fi

          # HARD GATE (deterministic): if this PR edits the sources but not the committed
          # artifact, the artifact is by definition stale. This is the exact mistake the
          # guard exists to catch, and it needs no assumptions about build reproducibility.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            CHANGED=$(git diff --name-only "$BASE...HEAD")
            if echo "$CHANGED" | grep -qE '\.(sinc|slaspec)$' && ! echo "$CHANGED" | grep -q "$SLA"; then
              echo "::error::This PR changes .sinc/.slaspec but not $SLA. Rebuild it and commit the result:"
              echo "::error::  cd data && \$GHIDRA_INSTALL_DIR/support/sleigh -i sleighArgs.txt -a ./languages"
              exit 1
            fi
          fi

          # SOFT SIGNAL: byte-compare the committed artifact against this fresh build.
          # Reported, not enforced -- SLEIGH output is not guaranteed to be reproducible
          # across build paths/versions, so a mismatch here is a prompt to look, not proof
          # of staleness. Promote to a hard failure once it has proven stable in practice.
          if git diff --quiet -- "$SLA"; then
            echo "Committed .sla is byte-identical to a fresh build."
          else
            echo "::warning::Committed .sla differs byte-wise from a fresh build of these sources."
            echo "::warning::That is expected if SLEIGH output is not reproducible; verify it is not staleness."
          fi

      - name: Publish compiled .sla
        uses: actions/upload-artifact@v4
        with:
          name: tms320c28x-sla
          path: data/languages/tms320c28x.sla
          if-no-files-found: error

      # The zip is built on EVERY push and PR, not just when releasing. Gating it to
      # the release path would mean a broken extension build is discovered only when
      # you try to ship, which is the worst possible moment to find out.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"       # Ghidra requires >= 8.5 (application.properties)

      - name: Build the installable extension zip
        run: |
          set -euo pipefail
          # NOTE: extension.properties `version` is the GHIDRA version (12.1.2), not the
          # release tag -- Ghidra refuses to load an extension whose version does not match
          # the running install. Do not rewrite it to the CalVer tag.
          gradle -PGHIDRA_INSTALL_DIR="$GHIDRA_INSTALL_DIR" distributeExtension
          ls -la dist/

      - name: Publish extension zip
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-tms320c28x-extension
          path: dist/*.zip
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Manual release. CalVer (vYYYY.MM.DD), because this module tracks a hardware
  # ISA rather than an API -- there is no semantic "breaking change" axis for
  # consumers, just "newer decode is better".
  #
  # Publishes the artifacts the build job already produced rather than rebuilding,
  # so what ships is exactly what CI compiled and checked.
  # -------------------------------------------------------------------------
  release:
    name: Release
    needs: sleigh
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the tag + release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need existing tags to pick the next CalVer suffix

      - uses: actions/download-artifact@v4
        with:
          name: ghidra-tms320c28x-extension
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: tms320c28x-sla
          path: sla

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="v$(date -u +%Y.%m.%d)"
          TAG="$BASE"
          n=1
          # More than one release in a day is possible; suffix rather than clobber.
          while gh release view "$TAG" >/dev/null 2>&1 \
                || git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; do
            n=$((n + 1))
            TAG="$BASE.$n"
          done
          echo "Releasing $TAG from ${GITHUB_SHA:0:12}"
          ls -la dist sla

          # --generate-notes derives the changelog from the previous release on its own.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            dist/*.zip \
            sla/tms320c28x.sla
